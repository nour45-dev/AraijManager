<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Rounded Square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Graduation Cap Icon -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <!-- Cap Top Diamond -->
    <path d="M256 120 L430 200 L256 280 L82 200 Z" fill="#ffffff" />
    
    <!-- Cap Rim Under -->
    <path d="M140 230 L140 310 C140 370 372 370 372 310 L372 230 L256 280 Z" fill="rgba(255, 255, 255, 0.92)" />

    <!-- Tassel -->
    <path d="M400 210 L425 290 C425 315 410 325 405 350 L400 350" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <circle cx="400" cy="210" r="10" fill="#fbbf24" />
    <rect x="394" y="340" width="16" height="30" rx="4" fill="#fbbf24" />
  </g>

  <!-- Arabic Typography "الأريج" -->
  <text x="256" y="445" font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-size="58" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    سنتر الأريج
  </text>
</svg>
